[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os-scheduling-lab"
version = "0.1.0"
description = "Reproducible Linux CPU scheduler experiments for local Ollama inference"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = ["matplotlib>=3.8,<4", "numpy>=1.26,<3"]

[project.scripts]
scheduling-lab = "scheduler_lab.cli:main"

[tool.setuptools.packages.find]
include = ["scheduler_lab*"]
